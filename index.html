<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AtmosVue — a Liquid Glass living weather map: rain intensity, rain chance, wind flow, pressure systems, LPA & storm tracking.">
<title>AtmosVue — Liquid Glass Storm Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%2357a9ff'/%3E%3Ccircle cx='24' cy='24' r='9' fill='white' opacity='.55'/%3E%3C/svg%3E">

<body data-theme="clear-night">

<div id="map" aria-label="Weather map"></div>
<canvas id="windCanvas" aria-hidden="true"></canvas>

<header class="topbar glass pane-top anim d0">
  <div class="brand"><span class="brand-orb" aria-hidden="true"></span><span class="brand-name">Atmos<em>Vue</em></span></div>
  <form class="search well" id="searchForm" role="search">

    <input id="searchInput" type="text" placeholder="Search any city…" autocomplete="off" spellcheck="false" aria-label="Search for a city">
    <button type="button" class="clear-btn press" id="clearBtn" hidden aria-label="Clear search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    <div class="suggest glass pane-top" id="suggest" role="listbox"></div>

    <span class="thumb" aria-hidden="true"></span>

    <button type="button" data-u="f" class="press" aria-pressed="false">°F</button>

  <button type="button" class="iconbtn well press" id="locateBtn" aria-label="Use my current location" title="Use my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/></svg>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="3.5"/><line x1="14.5" y1="4" x2="14.5" y2="20"/></svg>
  </button>
</header>

<aside class="layers glass pane-top anim d1" aria-label="Map layers">
  <span class="eyebrow">Filters</span>
  <label class="lrow"><span class="lname">Rain intensity</span><span class="switch"><input type="checkbox" data-layer="rain" checked><i></i></span></label>
  <label class="lrow"><span class="lname">Rain chance</span><span class="switch"><input type="checkbox" data-layer="chance" checked><i></i></span></label>
  <label class="lrow"><span class="lname">Wind flow</span><span class="switch"><input type="checkbox" data-layer="wind" checked><i></i></span></label>
  <label class="lrow"><span class="lname">Pressure systems</span><span class="switch"><input type="checkbox" data-layer="pressure"><i></i></span></label>
  <label class="lrow"><span class="lname">Storms &amp; tropical</span><span class="switch"><input type="checkbox" data-layer="systems" checked><i></i></span></label>

<section class="legend glass pane-top anim d2" id="legend" aria-label="Layer legend">
  <header class="legend-head">
    <span class="eyebrow">Legend</span>
    <button type="button" class="iconbtn well press legend-btn" id="legendBtn" aria-label="Collapse legend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9.5 12 15l6-5.5"/></svg></button>
  </header>
  <div class="legend-body" id="legendBody"></div>
</section>

<section class="syscard glass pane-top" id="syscard" aria-live="polite">

    <div><h2 id="sysTitle">—</h2><p class="sub" id="sysSub">—</p></div>

<section class="dash glass pane-top anim d3" id="dash" aria-label="Location dashboard">

        <path class="arc-fill" id="arcFill" d="M14 104 Q 130 -6 246 104"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(() => {
"use strict";
/* =====================================================================
   AtmosVue — map-first Liquid Glass weather.
   Open-Meteo (176-pt grid + point forecast) · RainViewer radar ·
   BigDataCloud reverse geocode · Esri Dark Gray basemap · Leaflet.
===================================================================== */
const API = {
  forecast: "https://api.open-meteo.com/v1/forecast",
  geocode:  "https://geocoding-api.open-meteo.com/v1/search",
  reverse:  "https://api.bigdatacloud.net/data/reverse-geocode-client",
  radar:    "https://api.rainviewer.com/public/weather-maps.json"
};
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a + (b-a)*t;

const els = {};
["map","windCanvas","searchForm","searchInput","clearBtn","suggest","units","locateBtn","dashBtn",
 "legend","legendBody","legendBtn","syscard","sysTitle","sysSub","sysBody","sysClose",
 "dash","dashExpand","placeName","placeMeta","clockText","heroTemp","heroCond","heroIcon","heroChips",
 "statGrid","sunSvg","arcFill","sunDot","sunHalo","dayLen","sunrise","sunset","hourStrip","hourPrev",
 "hourNext","dayList","loader","loaderLabel","toast","toastMsg"]
 .forEach(id => els[id] = document.getElementById(id));

const state = { place:null, data:null, unit:"c", tz:null, clockTimer:null,
                layers:{rain:true, chance:true, wind:true, pressure:false, systems:true, radar:false},
                field:null, suppressClick:false };

/* ---------------- helpers ---------------- */
async function getJSON(url, ms=12000){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms);
  try { const r = await fetch(url, {signal:c.signal}); if(!r.ok) throw new Error("HTTP "+r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const fmtTemp = c => state.unit==="c" ? Math.round(c) : Math.round(c*9/5+32);
const degSym  = () => state.unit==="c" ? "°C" : "°F";
const fmtWind = k => state.unit==="c" ? Math.round(k)+" km/h" : Math.round(k*0.621371)+" mph";
const fmtRain = m => state.unit==="c" ? m.toFixed(1)+" mm/h" : (m*0.0394).toFixed(2)+" in/h";
const fmtClock = iso => new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const fmtHour = iso => { const h=+iso.slice(11,13); return (h%12||12)+(h<12?"AM":"PM"); };
const flag = cc => cc ? String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)) : "";
const fmtLat = (la,lo) => Math.abs(la).toFixed(1)+"°"+(la>=0?"N":"S")+" "+Math.abs(lo).toFixed(1)+"°"+(lo>=0?"E":"W");

let toastTimer=null;
function toast(m){ els.toastMsg.textContent=m; els.toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>els.toast.classList.remove("show"),4600); }
const showLoader = m => { els.loaderLabel.textContent=m||"Reading the sky…"; els.loader.classList.remove("off"); };
const hideLoader = () => els.loader.classList.add("off");

/* ---------------- WMO + animated icons ---------------- */
const WMO = {0:["Clear sky","sun"],1:["Mostly clear","sun"],2:["Partly cloudy","partly"],3:["Overcast","cloud"],45:["Fog","fog"],48:["Icy fog","fog"],51:["Light drizzle","drizzle"],53:["Drizzle","drizzle"],55:["Heavy drizzle","drizzle"],56:["Freezing drizzle","drizzle"],57:["Freezing drizzle","drizzle"],61:["Light rain","rain"],63:["Rain","rain"],65:["Heavy rain","rain"],66:["Freezing rain","rain"],67:["Freezing rain","rain"],71:["Light snow","snow"],73:["Snow","snow"],75:["Heavy snow","snow"],77:["Snow grains","snow"],80:["Light showers","rain"],81:["Showers","rain"],82:["Heavy showers","rain"],85:["Snow showers","snow"],86:["Snow showers","snow"],95:["Thunderstorm","thunder"],96:["Thunderstorm","thunder"],99:["Hailstorm","thunder"]};
const wmoInfo = c => WMO[c]||["Unknown","cloud"];
const iconKey = (c,d=true)=>{const k=wmoInfo(c)[1]; if(!d&&k==="sun")return"moon"; if(!d&&k==="partly")return"partlynight"; return k;};
const themeFor = (c,d)=>{const k=wmoInfo(c)[1]; if(k==="sun"||k==="partly")return d?"clear-day":"clear-night"; if(k==="fog")return"fog"; if(k==="snow")return"snow"; if(k==="thunder")return"thunder"; if(k==="drizzle"||k==="rain")return"rain"; return"overcast";};

const CLOUD='<path class="cloudbody" fill="#FFF" fill-opacity=".96" stroke="rgba(20,42,72,.1)" d="M46 48H21a10 10 0 1 1 2.6-19.7A14 14 0 0 1 50.8 31 9 9 0 0 1 46 48Z"/>';
const ICONS = {
 sun:'<g class="spin-sun"><g class="rays" stroke="#FFD75E" stroke-width="3.4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="12.5"/><line x1="32" y1="51.5" x2="32" y2="58"/><line x1="6" y1="32" x2="12.5" y2="32"/><line x1="51.5" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="18.2" y2="18.2"/><line x1="45.8" y1="45.8" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="18.2" y2="45.8"/><line x1="45.8" y1="18.2" x2="50.4" y2="13.6"/></g><circle cx="32" cy="32" r="12.5" fill="#FFD75E"/></g>',
 moon:'<path fill="#EAF2FF" d="M40 6a25 25 0 1 0 18 34A21 21 0 0 1 40 6Z"/><circle class="tw tw1" cx="46" cy="13" r="1.7" fill="#EAF2FF"/><circle class="tw tw2" cx="54" cy="23" r="1.2" fill="#EAF2FF"/>',
 partly:'<g class="spin-sun"><g class="rays" stroke="#FFD75E" stroke-width="2.6" stroke-linecap="round"><line x1="20" y1="5.5" x2="20" y2="9.5"/><line x1="5.5" y1="20" x2="9.5" y2="20"/><line x1="9.8" y1="9.8" x2="12.6" y2="12.6"/><line x1="20" y1="34.5" x2="20" y2="30.5"/><line x1="34.5" y1="20" x2="30.5" y2="20"/><line x1="30.2" y1="9.8" x2="27.4" y2="12.6"/></g><circle cx="20" cy="20" r="8.5" fill="#FFD75E"/></g><g class="drift">'+CLOUD+'</g>',
 partlynight:'<path fill="#EAF2FF" d="M22 5a13.5 13.5 0 1 0 9.7 18.4A11.3 11.3 0 0 1 22 5Z"/><g class="drift">'+CLOUD+'</g>',
 cloud:'<g class="drift"><path fill="#FFF" fill-opacity=".55" d="M50 30a10 10 0 0 0-9.6-7.4A13 13 0 0 0 28 18Z"/>'+CLOUD+'</g>',
 fog:'<g class="drift" transform="translate(0,-4)">'+CLOUD+'</g><g class="foglines" stroke="#DDE7F2" stroke-width="3" stroke-linecap="round"><line class="fl fl1" x1="14" y1="52" x2="46" y2="52"/><line class="fl fl2" x1="20" y1="57.5" x2="52" y2="57.5"/><line class="fl fl3" x1="14" y1="63" x2="40" y2="63"/></g>',
 drizzle:'<g class="drift">'+CLOUD+'</g><g stroke="#7FC8FF" stroke-width="3" stroke-linecap="round"><line class="fall f1" x1="26" y1="51" x2="24.6" y2="56"/><line class="fall f2" x1="38" y1="51" x2="36.6" y2="56"/></g>',
 rain:'<g class="drift">'+CLOUD+'</g><g stroke="#7FC8FF" stroke-width="3.2" stroke-linecap="round"><line class="fall f1" x1="24" y1="51" x2="21.8" y2="59"/><line class="fall f2" x1="33" y1="51" x2="30.8" y2="59"/><line class="fall f3" x1="42" y1="51" x2="39.8" y2="59"/></g>',
 snow:'<g class="drift">'+CLOUD+'</g><g fill="#FFF"><circle class="flake k1" cx="24" cy="53" r="2.1"/><circle class="flake k2" cx="33" cy="55" r="1.7"/><circle class="flake k3" cx="42" cy="53" r="2.1"/></g>',
 thunder:'<g class="drift">'+CLOUD+'</g><polygon class="bolt" fill="#FFD95E" points="33,42 25,54 31,54 27.5,63 40,49 33.6,49 38,42"/>'
};
const iconSVG = k => '<svg class="wicon" viewBox="0 0 64 64" aria-hidden="true">'+(ICONS[k]||ICONS.cloud)+'</svg>';
const IC = {
 thermo:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13.6V5a2 2 0 1 1 4 0v8.6a4.5 4.5 0 1 1-4 0Z"/></svg>',
 hilow:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14V5M4.5 7.5 7 5l2.5 2.5M17 10v9M14.5 16.5 17 19l2.5-2.5"/></svg>',
 wind:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8.5h10a2.6 2.6 0 1 0-2.5-3.3M3 12.5h15a2.6 2.6 0 1 1-2.5 3.3M3 16.5h7a2.3 2.3 0 1 1-2.2 3"/></svg>',
 drop:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5s6 6.7 6 11a6 6 0 0 1-12 0c0-4.3 6-11 6-11Z"/></svg>',
 gauge:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 16a8 8 0 1 1 15 0"/><path d="M12 16l3.6-4.6"/></svg>',
 uv:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></svg>',
 cloudS:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M17.5 18h-9a4.5 4.5 0 1 1 1.2-8.9A6 6 0 0 1 21 11.5 3.8 3.8 0 0 1 17.5 18Z"/></svg>',
 pop:'<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5s6 6.7 6 11a6 6 0 0 1-12 0c0-4.3 6-11 6-11Z"/></svg>',
 arrow:'<svg class="wind-arrow" viewBox="0 0 24 24"><path d="M12 3.2 17.6 17l-5.6-3-5.6 3Z" fill="currentColor"/></svg>'
};

/* =====================================================================
   MAP — Esri Dark Gray Canvas (reliable, key-free) + dark error tile
===================================================================== */
const ERR_TILE = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
const map = L.map("map", { zoomControl:false, attributionControl:false, worldCopyJump:true, minZoom:2, maxZoom:11, zoomSnap:.5 })
             .setView([18, 8], 3);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
            { maxZoom:16, opacity:.96, errorTileUrl:ERR_TILE }).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}",
            { maxZoom:16, opacity:.9, errorTileUrl:ERR_TILE }).addTo(map);

const zoomUI = document.createElement("div");
zoomUI.className = "zoomui";
zoomUI.innerHTML = '<button class="iconbtn well press" id="zin" aria-label="Zoom in">+</button><button class="iconbtn well press" id="zout" aria-label="Zoom out">−</button>';
document.body.appendChild(zoomUI);
$("#zin").addEventListener("click", () => map.zoomIn());
$("#zout").addEventListener("click", () => map.zoomOut());

/* =====================================================================
   ATMOSPHERIC FIELD — 176-point Open-Meteo grid over the viewport
===================================================================== */
const COLS=16, ROWS=11;
let fieldSeq=0, fieldBounds=null;

async function refreshField(){
  const b = map.getBounds();
  const west=b.getWest(), east=b.getEast();
  if (west > east) return;
  const south=b.getSouth(), north=b.getNorth();
  const lats=[], lngs=[], la=[], lo=[];
  for (let r=0;r<ROWS;r++) lats.push(north-(north-south)*r/(ROWS-1));
  for (let c=0;c<COLS;c++) lngs.push(west+(east-west)*c/(COLS-1));
  for (const a of lats) for (const o of lngs){ la.push(a.toFixed(2)); lo.push(o.toFixed(2)); }
  const seq=++fieldSeq;
  try{
    const url = API.forecast+"?latitude="+la.join(",")+"&longitude="+lo.join(",")
      +"&current=pressure_msl,wind_speed_10m,wind_direction_10m,precipitation,weather_code"
      +"&hourly=precipitation_probability&forecast_days=1&timezone=UTC";
    const raw = await getJSON(url, 15000);
    if (seq!==fieldSeq) return;
    const list = Array.isArray(raw)?raw:[raw];
    const cells = list.map(d=>{
      const cur=d.current, rad=cur.wind_direction_10m*Math.PI/180, sp=cur.wind_speed_10m;
      return { p:cur.pressure_msl, sp, u:-Math.sin(rad)*sp, v:-Math.cos(rad)*sp,
               pr:cur.precipitation, code:cur.weather_code,
               pop:d.hourly?.precipitation_probability?.[0] ?? 0 };
    });
    state.field = { lats, lngs, cells };
    fieldBounds = L.latLngBounds([south,west],[north,east]);
    renderOverlays(); detectSystems();
  }catch(e){ console.error(e); }
}

function sample(lat,lng){
  const f=state.field; if(!f) return null;
  const {lats,lngs,cells}=f;
  const dy=(lats[0]-lats[ROWS-1])/(ROWS-1), dx=(lngs[COLS-1]-lngs[0])/(COLS-1);
  const fy=(lats[0]-lat)/dy, fx=(lng-lngs[0])/dx;
  if (fy<0||fx<0||fy>ROWS-1||fx>COLS-1) return null;
  const r0=Math.floor(fy), c0=Math.floor(fx), tr=fy-r0, tc=fx-c0;
  const r1=Math.min(r0+1,ROWS-1), c1=Math.min(c0+1,COLS-1);
  const A=cells[r0*COLS+c0], B=cells[r0*COLS+c1], C=cells[r1*COLS+c0], D=cells[r1*COLS+c1];
  const mix=(a,b,t)=>a+(b-a)*t, M={};
  for (const k of ["p","sp","u","v","pr","pop"])
    M[k]=mix(mix(A[k],B[k],tc), mix(C[k],D[k],tc), tr);
  return M;
}

/* ---------------- color ramps ---------------- */
function rampColor(stops, v){
  if (v<=stops[0][0]) return stops[0];
  for (let i=0;i<stops.length-1;i++){
    const [v0,r0,g0,b0,a0]=stops[i], [v1,r1,g1,b1,a1]=stops[i+1];
    if (v<=v1){ const t=(v-v0)/(v1-v0);
      return [lerp(r0,r1,t),lerp(g0,g1,t),lerp(b0,b1,t),lerp(a0,a1,t)]; }
  }
  return stops[stops.length-1];
}
const RAIN_STOPS=[
 [0.0, 255,255,255,0], [0.2, 255,224,70,.55], [2, 255,205,40,.78],
 [10, 255,140,0,.85], [25, 255,45,60,.9], [60, 125,0,10,.95]];
const CHANCE_STOPS=[
 [0, 255,255,255,0], [20, 150,220,255,.25], [50, 70,150,255,.6], [100, 130,90,255,.85]];
const PRESS_COLOR = p => {
  if (p<1008){ const t=clamp((1008-p)/26,0,1); return [70,140,255,.55*t]; }
  if (p>1018){ const t=clamp((p-1018)/20,0,1); return [255,170,90,.4*t]; }
  return [0,0,0,0];
};
const windColor = sp =>
  sp<20 ? "rgba(255,255,255,.55)" : sp<39 ? "rgba(140,225,255,.7)" :
  sp<62 ? "rgba(255,220,90,.8)" : sp<119 ? "rgba(255,140,60,.85)" : "rgba(255,70,70,.95)";

/* ---------------- raster overlays ---------------- */
const BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const ovRain   = L.imageOverlay(BLANK, [[0,0],[1,1]], {opacity:.66, className:"ov ov-rain",   interactive:false}).addTo(map);
const ovChance = L.imageOverlay(BLANK, [[0,0],[1,1]], {opacity:.55, className:"ov ov-chance", interactive:false}).addTo(map);
const ovPress  = L.imageOverlay(BLANK, [[0,0],[1,1]], {opacity:.42, className:"ov ov-press",  interactive:false}).addTo(map);

function fieldCanvas(get){
  const cv=document.createElement("canvas"); cv.width=COLS; cv.height=ROWS;
  const ctx=cv.getContext("2d"), f=state.field;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const [cr,cg,cb,ca]=get(f.cells[r*COLS+c]);
    ctx.fillStyle=`rgba(${cr|0},${cg|0},${cb|0},${ca})`;
    ctx.fillRect(c,r,1,1);
  }
  return cv.toDataURL();
}
function renderOverlays(){
  if (!state.field||!fieldBounds) return;
  ovRain.setBounds(fieldBounds); ovChance.setBounds(fieldBounds); ovPress.setBounds(fieldBounds);
  if (state.layers.rain)     ovRain.setUrl(fieldCanvas(c=>rampColor(RAIN_STOPS,c.pr)));
  if (state.layers.chance)   ovChance.setUrl(fieldCanvas(c=>rampColor(CHANCE_STOPS,c.pop)));
  if (state.layers.pressure) ovPress.setUrl(fieldCanvas(c=>PRESS_COLOR(c.p)));
}

/* =====================================================================
   WIND FLOW — particle advection
===================================================================== */
const wcv=els.windCanvas, wctx=wcv.getContext("2d");
let parts=[], windOn=true, moving=false;
function sizeWind(){ wcv.width=innerWidth; wcv.height=innerHeight; }
sizeWind(); addEventListener("resize", sizeWind);
const spawn=()=>{ const b=map.getBounds();
  return { lat:lerp(b.getSouth(),b.getNorth(),Math.random()), lng:lerp(b.getWest(),b.getEast(),Math.random()), age:0 }; };
function seedParts(){ const n=innerWidth<700?240:620; parts=Array.from({length:n},spawn); wctx.clearRect(0,0,wcv.width,wcv.height); }
function windFrame(){
  requestAnimationFrame(windFrame);
  if (!state.field||!windOn||moving||document.hidden) return;
  const z=map.getZoom(), k=0.05*Math.pow(1.55, z-3);
  wctx.globalCompositeOperation="destination-out"; wctx.fillStyle="rgba(0,0,0,.07)";
  wctx.fillRect(0,0,wcv.width,wcv.height);
  wctx.globalCompositeOperation="lighter"; wctx.lineWidth=1.4; wctx.lineCap="round";
  for (const p of parts){
    const s=sample(p.lat,p.lng);
    if (!s||s.sp<1||p.age>140){ Object.assign(p,spawn()); continue; }
    const a=map.latLngToContainerPoint([p.lat,p.lng]);
    p.lat+=s.v*0.0022; p.lng+=s.u*0.0022/Math.max(.2,Math.cos(p.lat*Math.PI/180)); p.age++;
    const b=map.latLngToContainerPoint([p.lat,p.lng]);
    wctx.strokeStyle=windColor(s.sp);
    wctx.beginPath(); wctx.moveTo(a.x,a.y); wctx.lineTo(b.x,b.y); wctx.stroke();
  }
}
map.on("movestart", ()=>{ moving=true; wctx.clearRect(0,0,wcv.width,wcv.height); });
map.on("moveend",   ()=>{ moving=false; seedParts(); queueRefresh(); });
map.on("zoomend",   ()=>{ seedParts(); });

/* =====================================================================
   SYSTEMS — LPAs always visible (with dev-% badge), storms, highs
===================================================================== */
const sysGroup=L.layerGroup().addTo(map);
const devChance=(p,sp,lat)=>Math.round(clamp(0.45*(1010-p)+0.9*Math.max(0,sp-25)+(Math.abs(lat)<=30?10:0),3,96));
function classify(sp,lat){
  const trop=Math.abs(lat)<=23.5;
  if (sp>=119) return trop?"Hurricane / Typhoon":"Hurricane-force low";
  if (sp>=89)  return trop?"Severe tropical storm":"Severe storm";
  if (sp>=62)  return trop?"Tropical storm":"Storm";
  if (sp>=39&&trop) return "Tropical depression";
  return null;
}
function detectSystems(){
  sysGroup.clearLayers();
  if (!state.layers.systems && !state.layers.pressure) return;
  const f=state.field; if(!f) return;
  const pts=[];
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const cell=f.cells[r*COLS+c], lat=f.lats[r], lng=f.lngs[c];
    let kind=null;
    if (cell.sp>=62||cell.p<=996) kind="storm";
    else if (cell.p<1010) kind="low";
    else if (cell.p>1024) kind="high";
    if (kind) pts.push({lat,lng,cell,kind});
  }
  const used=new Set(), systems=[];
  pts.forEach((p,i)=>{
    if (used.has(i)) return;
    const cluster=[p]; used.add(i);
    pts.forEach((q,j)=>{ if(!used.has(j)&&q.kind===p.kind&&Math.abs(q.lat-p.lat)<4&&Math.abs(q.lng-p.lng)<4){ cluster.push(q); used.add(j);} });
    const n=cluster.length;
    const agg={ kind:p.kind, n,
      lat:cluster.reduce((s,q)=>s+q.lat,0)/n, lng:cluster.reduce((s,q)=>s+q.lng,0)/n,
      p:Math.min(...cluster.map(q=>q.cell.p)), sp:Math.max(...cluster.map(q=>q.cell.sp)),
      pr:Math.max(...cluster.map(q=>q.cell.pr)) };
    if (p.kind==="high") agg.p=Math.max(...cluster.map(q=>q.cell.p));
    systems.push(agg);
  });
  systems.slice(0,60).forEach(s=>{
    const trop=Math.abs(s.lat)<=23.5;
    const cls=classify(s.sp,s.lat);
    let type=null;
    if (s.kind==="storm")            { if (state.layers.systems) type="storm"; }
    else if (s.kind==="low")         { if (state.layers.systems&&cls) type="storm";
                                       else if (state.layers.systems||state.layers.pressure) type="low"; }
    else                             { if (state.layers.pressure) type="high"; }
    if (!type) return;
    const dev = s.kind==="low" ? devChance(s.p,s.sp,s.lat) : null;
    const label = type==="storm"?"S":type==="low"?"L":"H";
    const html = `<div class="sys ${type}${trop&&type!=="high"?" trop":""}"><i class="ring"></i><span>${label}</span>${type==="low"&&dev!=null?`<em>${dev}%</em>`:""}</div>`;
    const m=L.marker([s.lat,s.lng], { icon:L.divIcon({className:"syswrap", html, iconSize:[46,46], iconAnchor:[23,23]}) });
    m.on("click", e=>{
      if (e.originalEvent) L.DomEvent.stop(e.originalEvent);
      state.suppressClick=true; setTimeout(()=>state.suppressClick=false,350);
      openSysCard(s,cls,trop);
    });
    m.addTo(sysGroup);
  });
}
function openSysCard(s,cls,trop){
  els.sysTitle.textContent = cls || (s.kind==="low"?"Low pressure area":s.kind==="high"?"High pressure area":"Storm system");
  els.sysSub.textContent = fmtLat(s.lat,s.lng)+(trop?" · Tropical belt":"");
  const dev = s.kind==="low"&&!cls ? devChance(s.p,s.sp,s.lat) : null;
  els.sysBody.innerHTML = `
    <div class="sys-rows">
      <span>Pressure</span><b>${Math.round(s.p)} hPa</b>
      <span>Max wind</span><b>${fmtWind(s.sp)}</b>
      <span>Rain rate</span><b>${fmtRain(s.pr)}</b>
      <span>Class</span><b>${cls??"—"}</b>
    </div>
    ${dev!=null?`<div class="dev"><div class="dev-top"><span>Storm development chance</span><b>${dev}%</b></div><div class="meter"><i class="mfill"></i></div><p class="dev-note">Heuristic from pressure deficit, wind &amp; latitude band.</p></div>`:""}
    <div class="tags">${trop?'<span class="tag">Tropical</span>':'<span class="tag">Mid-latitude</span>'}${s.kind==="storm"?'<span class="tag hot">Winds ≥ storm force</span>':""}</div>`;
  if (dev!=null) els.sysBody.querySelector(".mfill").style.setProperty("--pct", dev+"%");
  els.syscard.classList.add("show");
}
els.sysClose.addEventListener("click", ()=>els.syscard.classList.remove("show"));

let radarLayer=null, radarFrames=[], radarIdx=0, radarTimer=null;
async function radarOn(){
  try{

  if (Ls.radar) h+=`<div class="lg-sec"><h3>Live radar</h3><p class="lg-note">Composite reflectivity · past 2 h + 30 min nowcast.</p></div>`;

}

function renderSun(){

function positionSun(rise,set){
  let now; try{ now=new Date(new Date().toLocaleString("en-US",{timeZone:state.tz})); }catch{ now=new Date(); }
  const t=clamp((now-rise)/(set-rise),0,1);
  const x=(1-t)**2*14+2*(1-t)*t*130+t**2*246, y=(1-t)**2*104+2*(1-t)*t*-6+t**2*104;
  [els.sunDot,els.sunHalo].forEach(c=>{ c.setAttribute("cx",x.toFixed(1)); c.setAttribute("cy",y.toFixed(1)); });
  els.arcFill.setAttribute("stroke-dashoffset",(ARC_LEN*(1-t)).toFixed(1));
  els.sunSvg.classList.toggle("dusk", now<rise||now>set);
}

function startClock(){
  clearInterval(state.clockTimer);
  const tick=()=>{ try{ els.clockText.textContent=new Intl.DateTimeFormat("en-GB",{timeZone:state.tz,weekday:"short",hour:"2-digit",minute:"2-digit"}).format(new Date()); }catch{ els.clockText.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}); }
    if(state.data) positionSun(new Date(state.data.daily.sunrise[0]), new Date(state.data.daily.sunset[0])); };
  tick(); state.clockTimer=setInterval(tick,1000);
}
els.hourPrev.addEventListener("click",()=>els.hourStrip.scrollBy({left:-300,behavior:"smooth"}));
els.hourNext.addEventListener("click",()=>els.hourStrip.scrollBy({left:300,behavior:"smooth"}));

function setDash(open){
  els.dash.classList.toggle("open", open);
  document.body.classList.toggle("dash-open", open);
}
els.dashBtn.addEventListener("click", ()=>setDash(!els.dash.classList.contains("open")));
els.dashExpand.addEventListener("click", ()=>{
  els.dash.classList.toggle("full");
  document.body.classList.toggle("page-dash", els.dash.classList.contains("full"));
});

/* =====================================================================
   SEARCH / UNITS / LOCATE
===================================================================== */
let searchSeq=0, activeIdx=-1, lastResults=[], debTimer=null;
const closeSuggest=()=>{ els.suggest.classList.remove("open"); activeIdx=-1; };
els.searchInput.addEventListener("input", ()=>{
  const q=els.searchInput.value.trim(); els.clearBtn.hidden=!q; clearTimeout(debTimer);
  if(q.length<2){ closeSuggest(); return; }
  debTimer=setTimeout(async ()=>{
    const seq=++searchSeq;
    try{ const r=await getJSON(`${API.geocode}?name=${encodeURIComponent(q)}&count=6&language=en&format=json`,8000);
      if(seq!==searchSeq)return; lastResults=r.results||[];
      if(!lastResults.length){ closeSuggest(); return; }
      activeIdx=-1;
      els.suggest.innerHTML=lastResults.map((p,i)=>`<button type="button" class="sug" role="option" data-i="${i}"><span class="flag">${flag(p.country_code)}</span><span class="sug-txt"><b>${p.name}</b><i>${[p.admin1,p.country].filter(Boolean).join(", ")}</i></span></button>`).join("");
      els.suggest.classList.add("open");
    }catch{ closeSuggest(); }
  },350);
});
els.searchInput.addEventListener("keydown", e=>{
  const open=els.suggest.classList.contains("open");
  if(e.key==="Escape")closeSuggest();
  if(!open)return;
  if(e.key==="ArrowDown"){e.preventDefault();activeIdx=Math.min(activeIdx+1,lastResults.length-1);paint();}
  if(e.key==="ArrowUp"){e.preventDefault();activeIdx=Math.max(activeIdx-1,0);paint();}
  function paint(){ $$(".sug",els.suggest).forEach((b,i)=>b.classList.toggle("active",i===activeIdx)); }
});
els.searchForm.addEventListener("submit", e=>{ e.preventDefault(); if(lastResults.length) pickPlace(lastResults[activeIdx>=0?activeIdx:0]); });
els.suggest.addEventListener("click", e=>{ const b=e.target.closest(".sug"); if(b) pickPlace(lastResults[+b.dataset.i]); });
els.clearBtn.addEventListener("click", ()=>{ els.searchInput.value=""; els.clearBtn.hidden=true; closeSuggest(); els.searchInput.focus(); });
document.addEventListener("click", e=>{ if(!els.searchForm.contains(e.target)) closeSuggest(); }, {passive:true});

function pickPlace(p){
  if(!p)return; closeSuggest(); els.searchInput.value=p.name; els.searchInput.blur();
  map.flyTo([p.latitude,p.longitude], 8, {duration:1.6});
  loadPlace({name:p.name, latitude:p.latitude, longitude:p.longitude, admin1:p.admin1, country:p.country});
}
async function pickCoords(lat,lon){
  let name="Pinned location", admin1, country, cc;
  try{ const r=await getJSON(`${API.reverse}?latitude=${lat}&longitude=${lon}&localityLanguage=en`,6000);
    name=r.city||r.locality||name; admin1=r.principalSubdivision; country=r.countryName; cc=r.countryCode;
  }catch{}
  loadPlace({name, latitude:lat.toFixed(3), longitude:lon.toFixed(3), admin1, country, country_code:cc});
}
els.units.addEventListener("click", e=>{
  const b=e.target.closest("button[data-u]"); if(!b||state.unit===b.dataset.u)return;
  state.unit=b.dataset.u; els.units.dataset.unit=state.unit;
  $$("button[data-u]",els.units).forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.u===state.unit)));
  if(state.data)renderDash(); renderLegend();
});
const CUPERTINO={name:"Cupertino",latitude:37.323,longitude:-122.0322,admin1:"California",country:"United States"};
els.locateBtn.addEventListener("click", ()=>{
  if(!navigator.geolocation){ toast("Geolocation unsupported."); return; }
  els.locateBtn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(
    p=>{ els.locateBtn.classList.remove("busy"); map.flyTo([p.coords.latitude,p.coords.longitude],8,{duration:1.6}); pickCoords(p.coords.latitude,p.coords.longitude); },
    ()=>{ els.locateBtn.classList.remove("busy"); toast("Location unavailable."); },
    {timeout:9000, maximumAge:600000});
});

/* =====================================================================
   BOOT
===================================================================== */
renderLegend();
if (matchMedia("(min-width:1180px)").matches) setDash(true);
seedParts(); windFrame();
refreshField();
showLoader("Finding your sky…");
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    p=>pickCoords(p.coords.latitude,p.coords.longitude),
    ()=>{ map.flyTo([CUPERTINO.latitude,CUPERTINO.longitude],6,{duration:1.4}); loadPlace(CUPERTINO); },
    {timeout:3500, maximumAge:600000});
} else { loadPlace(CUPERTINO); }
})();
</script>
</body>
</html>
