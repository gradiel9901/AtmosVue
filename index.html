<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AtmosVue — a Liquid Glass weather experience. Live forecasts, sun path, hourly and 7-day outlook.">
  <meta name="theme-color" content="#2f7fd6">
  <title>AtmosVue — Liquid Glass Weather</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%2357a9ff'/%3E%3Ccircle cx='24' cy='24' r='9' fill='white' opacity='.55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="clear-day">

  <!-- ======== ENVIRONMENT: the scene the glass refracts ======== -->
  <div class="scene" aria-hidden="true">
    <div class="mesh">
      <i class="blob b1"></i>
      <i class="blob b2"></i>
      <i class="blob b3"></i>
      <i class="blob b4"></i>
    </div>
    <div class="fx fx-rain"></div>
    <div class="fx fx-snow"></div>
    <div class="fx fx-stars"></div>
    <div class="fx fx-flash"></div>
    <div class="grain"></div>
  </div>

  <!-- ======== TOP BAR ======== -->
  <header class="topbar glass pane-top anim d0">
    <div class="brand">
      <span class="brand-orb" aria-hidden="true"></span>
      <span class="brand-name">Atmos<em>Vue</em></span>
    </div>

    <form class="search well" id="searchForm" role="search">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Search any city…" autocomplete="off" spellcheck="false" aria-label="Search for a city">
      <button type="button" class="clear-btn press" id="clearBtn" hidden aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
      <div class="suggest glass pane-top" id="suggest" role="listbox" aria-label="City suggestions"></div>
    </form>

    <div class="units well" id="units" data-unit="c" role="group" aria-label="Temperature unit">
      <span class="thumb" aria-hidden="true"></span>
      <button type="button" data-u="c" class="press" aria-pressed="true">°C</button>
      <button type="button" data-u="f" class="press" aria-pressed="false">°F</button>
    </div>

    <button type="button" class="iconbtn well press" id="locateBtn" aria-label="Use my current location" title="Use my location">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <line x1="12" y1="1.5" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22.5"/>
        <line x1="1.5" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22.5" y2="12"/>
      </svg>
    </button>
  </header>

  <!-- ======== STAGE ======== -->
  <main class="stage">

    <!-- Current conditions -->
    <section class="glass pane-top hero anim d1" id="heroPane" aria-live="polite">
      <div class="hero-top">
        <div class="place">
          <h1 id="placeName">—</h1>
          <p class="sub" id="placeMeta">Locating…</p>
        </div>
        <div class="clock well" title="Local time">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="clockText">--:--</span>
        </div>
      </div>

      <div class="hero-main">
        <div class="temp-block">
          <div class="temp" id="heroTemp">--<span class="deg">°</span></div>
          <p class="cond-label" id="heroCond">Reading the sky…</p>
        </div>
        <div class="hero-icon" id="heroIcon" aria-hidden="true"></div>
      </div>

      <div class="chips" id="heroChips"></div>
    </section>

    <!-- Right rail -->
    <aside class="side">
      <section class="glass panel stats anim d2" aria-label="Detailed conditions">
        <header class="panel-head">
          <span class="eyebrow">Conditions</span>
          <span class="live"><i class="live-dot" aria-hidden="true"></i>Live</span>
        </header>
        <div class="stat-grid" id="statGrid"></div>
      </section>

      <section class="glass panel sun anim d3" aria-label="Sun path">
        <header class="panel-head">
          <span class="eyebrow">Sun path</span>
          <span class="daylen" id="dayLen">—</span>
        </header>
        <svg id="sunSvg" viewBox="0 0 260 118" role="img" aria-label="Sun position between sunrise and sunset">
          <line class="horizon" x1="6" y1="104" x2="254" y2="104"/>
          <path class="arc-bg"   d="M14 104 Q 130 -6 246 104"/>
          <path class="arc-fill" d="M14 104 Q 130 -6 246 104" id="arcFill"/>
          <circle class="sun-halo" id="sunHalo" r="11" cx="14" cy="104"/>
          <circle class="sun-dot"  id="sunDot"  r="6"  cx="14" cy="104"/>
        </svg>
        <div class="sun-times">
          <span class="st">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M4 17h16M7 17a5 5 0 0 1 10 0M12 3v5M9.5 5.5 12 3l2.5 2.5"/>
            </svg>
            <b id="sunrise">—</b>
          </span>
          <span class="st">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M4 17h16M7 17a5 5 0 0 1 10 0M12 8V3M9.5 5.5 12 8l2.5-2.5"/>
            </svg>
            <b id="sunset">—</b>
          </span>
        </div>
      </section>
    </aside>

    <!-- Hourly -->
    <section class="glass panel hourly anim d4" aria-label="Hourly forecast">
      <header class="panel-head">
        <span class="eyebrow">Next 24 hours</span>
        <div class="rail-btns">
          <button type="button" class="iconbtn well press" id="hourPrev" aria-label="Scroll hours back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
          </button>
          <button type="button" class="iconbtn well press" id="hourNext" aria-label="Scroll hours forward">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg>
          </button>
        </div>
      </header>
      <div class="hour-strip" id="hourStrip" tabindex="0" aria-label="Scrollable hourly forecast"></div>
    </section>

    <!-- 7-day -->
    <section class="glass panel daily anim d5" aria-label="Seven day forecast">
      <header class="panel-head">
        <span class="eyebrow">7-day outlook</span>
        <span class="eyebrow dim-note">tap a row to feel the glass</span>
      </header>
      <div class="day-list" id="dayList"></div>
    </section>
  </main>

  <footer class="foot anim d6">
    AtmosVue · Liquid Glass study · Live data by <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>
  </footer>

  <!-- ======== LOADER ======== -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <div class="loader-card">
      <div class="spinner-wrap">
        <div class="spinner-disc glass"></div>
        <div class="spinner-ring"></div>
      </div>
      <p class="loader-label" id="loaderLabel">Reading the sky…</p>
    </div>
  </div>

  <!-- ======== TOAST ======== -->
  <div class="toast glass pane-top" id="toast" role="alert">
    <svg class="toast-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3 2.5 20h19L12 3Z"/><line x1="12" y1="10" x2="12" y2="14.5"/><circle cx="12" cy="17.3" r=".4" fill="currentColor"/>
    </svg>
    <span id="toastMsg"></span>
  </div>

  <script>
  (() => {
    "use strict";

    /* ============================================================
       AtmosVue — all logic lives here.
       APIs: Open-Meteo (forecast + geocoding, no key required)
             BigDataCloud reverse-geocode (no key required)
    ============================================================ */

    const API = {
      forecast: "https://api.open-meteo.com/v1/forecast",
      geocode:  "https://geocoding-api.open-meteo.com/v1/search",
      reverse:  "https://api.bigdatacloud.net/data/reverse-geocode-client"
    };

    const $  = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    const els = {
      body: document.body,
      loader: $("#loader"), loaderLabel: $("#loaderLabel"),
      toast: $("#toast"), toastMsg: $("#toastMsg"),
      searchForm: $("#searchForm"), searchInput: $("#searchInput"),
      clearBtn: $("#clearBtn"), suggest: $("#suggest"),
      units: $("#units"), locateBtn: $("#locateBtn"),
      placeName: $("#placeName"), placeMeta: $("#placeMeta"),
      clockText: $("#clockText"),
      heroPane: $("#heroPane"), heroTemp: $("#heroTemp"),
      heroCond: $("#heroCond"), heroIcon: $("#heroIcon"), heroChips: $("#heroChips"),
      statGrid: $("#statGrid"),
      sunSvg: $("#sunSvg"), arcFill: $("#arcFill"), sunDot: $("#sunDot"), sunHalo: $("#sunHalo"),
      dayLen: $("#dayLen"), sunrise: $("#sunrise"), sunset: $("#sunset"),
      hourStrip: $("#hourStrip"), hourPrev: $("#hourPrev"), hourNext: $("#hourNext"),
      dayList: $("#dayList")
    };

    const state = { place: null, data: null, unit: "c", tz: null, clockTimer: null };

    /* ---------------- WMO weather-code dictionary ---------------- */
    const WMO = {
      0:["Clear sky","sun"],1:["Mostly clear","sun"],2:["Partly cloudy","partly"],3:["Overcast","cloud"],
      45:["Fog","fog"],48:["Icy fog","fog"],
      51:["Light drizzle","drizzle"],53:["Drizzle","drizzle"],55:["Heavy drizzle","drizzle"],
      56:["Freezing drizzle","drizzle"],57:["Freezing drizzle","drizzle"],
      61:["Light rain","rain"],63:["Rain","rain"],65:["Heavy rain","rain"],
      66:["Freezing rain","rain"],67:["Freezing rain","rain"],
      71:["Light snow","snow"],73:["Snow","snow"],75:["Heavy snow","snow"],77:["Snow grains","snow"],
      80:["Light showers","rain"],81:["Showers","rain"],82:["Heavy showers","rain"],
      85:["Snow showers","snow"],86:["Snow showers","snow"],
      95:["Thunderstorm","thunder"],96:["Thunderstorm","thunder"],99:["Hailstorm","thunder"]
    };
    const wmoInfo  = code => WMO[code] || ["Unknown","cloud"];
    const iconKey  = (code, isDay = true) => {
      const k = wmoInfo(code)[1];
      if (!isDay && k === "sun")   return "moon";
      if (!isDay && k === "partly") return "partlynight";
      return k;
    };
    const themeFor = (code, isDay) => {
      const k = wmoInfo(code)[1];
      if (k === "sun")    return isDay ? "clear-day" : "clear-night";
      if (k === "partly") return isDay ? "clear-day" : "clear-night";
      if (k === "fog")    return "fog";
      if (k === "snow")   return "snow";
      if (k === "thunder")return "thunder";
      if (k === "drizzle" || k === "rain") return "rain";
      return "overcast";
    };

    /* ---------------- Animated weather icon set (SVG) ---------------- */
    const CLOUD = '<path class="cloudbody" fill="#FFFFFF" fill-opacity=".96" stroke="rgba(20,42,72,.10)" stroke-width="1" d="M46 48H21a10 10 0 1 1 2.6-19.7A14 14 0 0 1 50.8 31 9 9 0 0 1 46 48Z"/>';
    const SUNRAYS = '<g class="rays" stroke="#FFD75E" stroke-width="3.4" stroke-linecap="round">' +
      '<line x1="32" y1="6" x2="32" y2="12.5"/><line x1="32" y1="51.5" x2="32" y2="58"/>' +
      '<line x1="6" y1="32" x2="12.5" y2="32"/><line x1="51.5" y1="32" x2="58" y2="32"/>' +
      '<line x1="13.6" y1="13.6" x2="18.2" y2="18.2"/><line x1="45.8" y1="45.8" x2="50.4" y2="50.4"/>' +
      '<line x1="13.6" y1="50.4" x2="18.2" y2="45.8"/><line x1="45.8" y1="18.2" x2="50.4" y2="13.6"/></g>';

    const ICONS = {
      sun:   `<g class="spin-sun">${SUNRAYS}<circle class="core" cx="32" cy="32" r="12.5" fill="#FFD75E"/></g>`,
      moon:  `<path class="core" fill="#EAF2FF" d="M40 6a25 25 0 1 0 18 34A21 21 0 0 1 40 6Z"/>
              <circle class="tw tw1" cx="46" cy="13" r="1.7" fill="#EAF2FF"/>
              <circle class="tw tw2" cx="54" cy="23" r="1.2" fill="#EAF2FF"/>`,
      partly:`<g class="spin-sun mini"><g class="rays" stroke="#FFD75E" stroke-width="2.6" stroke-linecap="round">
              <line x1="20" y1="5.5" x2="20" y2="9.5"/><line x1="5.5" y1="20" x2="9.5" y2="20"/>
              <line x1="9.8" y1="9.8" x2="12.6" y2="12.6"/><line x1="9.8" y1="30.2" x2="12.6" y2="27.4"/>
              <line x1="20" y1="34.5" x2="20" y2="30.5"/><line x1="34.5" y1="20" x2="30.5" y2="20"/>
              <line x1="30.2" y1="9.8" x2="27.4" y2="12.6"/></g>
              <circle cx="20" cy="20" r="8.5" fill="#FFD75E"/></g>
              <g class="drift">${CLOUD}</g>`,
      partlynight:
             `<g class="mini-moon"><path fill="#EAF2FF" d="M22 5a13.5 13.5 0 1 0 9.7 18.4A11.3 11.3 0 0 1 22 5Z"/></g>
              <g class="drift">${CLOUD}</g>`,
      cloud: `<g class="drift"><path fill="#FFFFFF" fill-opacity=".55" d="M50 30a10 10 0 0 0-9.6-7.4A13 13 0 0 0 28 18Z"/>${CLOUD}</g>`,
      fog:   `<g class="drift" transform="translate(0,-4)">${CLOUD}</g>
              <g class="foglines" stroke="#DDE7F2" stroke-width="3" stroke-linecap="round">
                <line class="fl fl1" x1="14" y1="52" x2="46" y2="52"/>
                <line class="fl fl2" x1="20" y1="57.5" x2="52" y2="57.5"/>
                <line class="fl fl3" x1="14" y1="63" x2="40" y2="63"/></g>`,
      drizzle:`<g class="drift">${CLOUD}</g>
              <g stroke="#7FC8FF" stroke-width="3" stroke-linecap="round">
                <line class="fall f1" x1="26" y1="51" x2="24.6" y2="56"/>
                <line class="fall f2" x1="38" y1="51" x2="36.6" y2="56"/></g>`,
      rain:  `<g class="drift">${CLOUD}</g>
              <g stroke="#7FC8FF" stroke-width="3.2" stroke-linecap="round">
                <line class="fall f1" x1="24" y1="51" x2="21.8" y2="59"/>
                <line class="fall f2" x1="33" y1="51" x2="30.8" y2="59"/>
                <line class="fall f3" x1="42" y1="51" x2="39.8" y2="59"/></g>`,
      snow:  `<g class="drift">${CLOUD}</g>
              <g fill="#FFFFFF">
                <circle class="flake k1" cx="24" cy="53" r="2.1"/>
                <circle class="flake k2" cx="33" cy="55" r="1.7"/>
                <circle class="flake k3" cx="42" cy="53" r="2.1"/></g>`,
      thunder:`<g class="drift">${CLOUD}</g>
              <polygon class="bolt" fill="#FFD95E" points="33,42 25,54 31,54 27.5,63 40,49 33.6,49 38,42"/>`
    };
    const iconSVG = key => `<svg class="wicon" viewBox="0 0 64 64" aria-hidden="true">${ICONS[key] || ICONS.cloud}</svg>`;

    /* Small glyph set for chips & stat tiles */
    const IC = {
      thermo: '<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13.6V5a2 2 0 1 1 4 0v8.6a4.5 4.5 0 1 1-4 0Z"/></svg>',
      hilow:  '<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14V5M4.5 7.5 7 5l2.5 2.5M17 10v9M14.5 16.5 17 19l2.5-2.5"/></svg>',
      wind:   '<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8.5h10a2.6 2.6 0 1 0-2.5-3.3M3 12.5h15a2.6 2.6 0 1 1-2.5 3.3M3 16.5h7a2.3 2.3 0 1 1-2.2 3"/></svg>',
      drop:   '<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5s6 6.7 6 11a6 6 0 0 1-12 0c0-4.3 6-11 6-11Z"/></svg>',
      gauge:  '<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4.5 16a8 8 0 1 1 15 0"/><path d="M12 16l3.6-4.6"/><circle cx="12" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>',
      uv:     '<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></svg>',
      cloudS: '<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M17.5 18h-9a4.5 4.5 0 1 1 1.2-8.9A6 6 0 0 1 21 11.5 3.8 3.8 0 0 1 17.5 18Z"/></svg>',
      pop:    '<svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5s6 6.7 6 11a6 6 0 0 1-12 0c0-4.3 6-11 6-11Z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5" stroke-linecap="round"/></svg>',
      arrow:  '<svg class="wind-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 17.6 17l-5.6-3-5.6 3Z" fill="currentColor"/></svg>'
    };

    /* ---------------- networking ---------------- */
    async function getJSON(url, ms = 10000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } finally { clearTimeout(timer); }
    }

    /* ---------------- formatting ---------------- */
    const fmtTemp = c => state.unit === "c" ? Math.round(c) : Math.round(c * 9 / 5 + 32);
    const degSym  = () => state.unit === "c" ? "°C" : "°F";
    const fmtWind = k => state.unit === "c" ? Math.round(k) + " km/h" : Math.round(k * 0.621371) + " mph";
    const fmtClock = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const fmtHour  = iso => { const h = +iso.slice(11, 13); return (h % 12 || 12) + (h < 12 ? "AM" : "PM"); };
    const flag     = cc => cc ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : "";

    /* ---------------- loader & toast ---------------- */
    const showLoader = msg => { els.loaderLabel.textContent = msg || "Reading the sky…"; els.loader.classList.remove("off"); };
    const hideLoader = () => els.loader.classList.add("off");

    let toastTimer = null;
    function toast(msg) {
      els.toastMsg.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 4600);
    }

    /* ============================================================
       DATA LOAD
    ============================================================ */
    async function loadPlace(place) {
      showLoader(`Tuning into ${place.name}…`);
      try {
        const url = `${API.forecast}?latitude=${place.latitude}&longitude=${place.longitude}`
          + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m`
          + `&hourly=temperature_2m,precipitation_probability,weather_code,is_day`
          + `&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,uv_index_max,wind_speed_10m_max`
          + `&timezone=auto&forecast_days=7`;
        const data = await getJSON(url);
        state.place = place;
        state.data  = data;
        state.tz    = data.timezone;
        els.body.dataset.theme = themeFor(data.current.weather_code, data.current.is_day === 1);
        renderAll();
        startClock();
        hideLoader();
      } catch (err) {
        console.error(err);
        hideLoader();
        toast("Couldn't reach the weather service — check your connection and try again.");
      }
    }

    /* ============================================================
       RENDERERS
    ============================================================ */
    function renderAll() { renderHero(); renderStats(); renderSun(true); renderHourly(); renderDaily(); }

    function renderHero() {
      const d = state.data, cur = d.current, place = state.place;
      const [label] = wmoInfo(cur.weather_code);

      els.placeName.textContent = place.name;
      els.placeMeta.textContent = [place.admin1, place.country].filter(Boolean).join(", ") || "Coordinates " + (+place.latitude).toFixed(2) + ", " + (+place.longitude).toFixed(2);
      els.heroTemp.innerHTML = `${fmtTemp(cur.temperature_2m)}<span class="deg">°</span>`;
      els.heroCond.textContent = label;
      els.heroIcon.innerHTML = iconSVG(iconKey(cur.weather_code, cur.is_day === 1));
      els.heroPane.setAttribute("aria-label",
        `${place.name}: ${label}, ${fmtTemp(cur.temperature_2m)} degrees, feels like ${fmtTemp(cur.apparent_temperature)}`);

      const hi = d.daily.temperature_2m_max[0], lo = d.daily.temperature_2m_min[0];
      els.heroChips.innerHTML = `
        <span class="chip well">${IC.thermo}Feels like <b>${fmtTemp(cur.apparent_temperature)}${degSym()}</b></span>
        <span class="chip well">${IC.hilow}H <b>${fmtTemp(hi)}°</b>&nbsp;·&nbsp;L <b>${fmtTemp(lo)}°</b></span>
        <span class="chip well">${IC.wind}Wind <b>${fmtWind(cur.wind_speed_10m)}</b></span>
        <span class="chip well">${IC.drop}Humidity <b>${cur.relative_humidity_2m}%</b></span>`;
    }

    function renderStats() {
      const cur = state.data.current, day = state.data.daily;
      const dew = cur.temperature_2m - (100 - cur.relative_humidity_2m) / 5;
      const p = cur.pressure_msl;
      const pressureNote = p < 1005 ? "Low · unsettled" : p > 1022 ? "High · settled" : "Steady";
      const uv = day.uv_index_max?.[0] ?? 0;
      const uvNote = uv <= 2 ? "Low" : uv <= 5 ? "Moderate" : uv <= 7 ? "High" : uv <= 10 ? "Very high" : "Extreme";
      const cc = cur.cloud_cover;
      const ccNote = cc < 10 ? "Mostly clear" : cc < 35 ? "Few clouds" : cc < 70 ? "Scattered" : "Overcast";
      const pop = day.precipitation_probability_max?.[0] ?? 0;

      els.statGrid.innerHTML = `
        <div class="stat tile lift">
          <div class="s-head">${IC.drop}<span>Humidity</span></div>
          <div class="s-val">${cur.relative_humidity_2m}<span class="s-unit">%</span></div>
          <div class="s-sub">Dew point ${fmtTemp(dew)}°</div>
        </div>
        <div class="stat tile lift" id="windTile">
          <div class="s-head">${IC.wind}<span>Wind</span></div>
          <div class="s-val">${fmtWind(cur.wind_speed_10m)}${IC.arrow}</div>
          <div class="s-sub">Gusts ${fmtWind(cur.wind_gusts_10m ?? cur.wind_speed_10m)}</div>
        </div>
        <div class="stat tile lift">
          <div class="s-head">${IC.gauge}<span>Pressure</span></div>
          <div class="s-val">${Math.round(p)}<span class="s-unit">hPa</span></div>
          <div class="s-sub">${pressureNote}</div>
        </div>
        <div class="stat tile lift">
          <div class="s-head">${IC.uv}<span>UV index</span></div>
          <div class="s-val">${Math.round(uv)}</div>
          <div class="s-sub">${uvNote} · today's max</div>
        </div>
        <div class="stat tile lift">
          <div class="s-head">${IC.cloudS}<span>Cloud cover</span></div>
          <div class="s-val">${cc}<span class="s-unit">%</span></div>
          <div class="s-sub">${ccNote}</div>
        </div>
        <div class="stat tile lift">
          <div class="s-head">${IC.pop}<span>Rain chance</span></div>
          <div class="s-val">${pop}<span class="s-unit">%</span></div>
          <div class="s-sub">${cur.precipitation > 0 ? cur.precipitation + " mm falling now" : "No rain right now"}</div>
        </div>`;

      /* Point the arrow where the wind blows TO (code reports FROM). */
      const windTile = $("#windTile");
      if (windTile) windTile.style.setProperty("--winddir", ((cur.wind_direction_10m + 180) % 360) + "deg");
    }

    /* ---- sun path: quadratic Bézier P0(14,104) C(130,-6) P2(246,104) ---- */
    const ARC_LEN = els.arcFill.getTotalLength();
    els.arcFill.setAttribute("stroke-dasharray", ARC_LEN);

    function renderSun(resetDash) {
      const day = state.data.daily;
      const rise = new Date(day.sunrise[0]);
      const set  = new Date(day.sunset[0]);
      els.sunrise.textContent = fmtClock(day.sunrise[0]);
      els.sunset.textContent  = fmtClock(day.sunset[0]);
      const mins = Math.max(0, Math.round((set - rise) / 60000));
      els.dayLen.textContent = `${Math.floor(mins / 60)} h ${mins % 60} m of light`;
      if (resetDash) els.arcFill.setAttribute("stroke-dasharray", ARC_LEN);
      positionSun(rise, set);
    }

    function positionSun(rise, set) {
      let now;
      try { now = new Date(new Date().toLocaleString("en-US", { timeZone: state.tz })); }
      catch { now = new Date(); }
      const t = clamp((now - rise) / (set - rise), 0, 1);
      const x = (1 - t) ** 2 * 14 + 2 * (1 - t) * t * 130 + t ** 2 * 246;
      const y = (1 - t) ** 2 * 104 + 2 * (1 - t) * t * -6 + t ** 2 * 104;
      for (const c of [els.sunDot, els.sunHalo]) { c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); }
      els.arcFill.setAttribute("stroke-dashoffset", (ARC_LEN * (1 - t)).toFixed(1));
      els.sunSvg.classList.toggle("dusk", now < rise || now > set);
    }

    function renderHourly() {
      const d = state.data, h = d.hourly;
      const hourNow = d.current.time.slice(0, 13);
      let i = h.time.findIndex(t => t.slice(0, 13) === hourNow);
      if (i < 0) i = Math.max(0, h.time.findIndex(t => t >= d.current.time));

      const frag = [];
      for (let n = 0; n < 24; n++) {
        const idx = i + n;
        if (idx >= h.time.length) break;
        const pop = h.precipitation_probability?.[idx] ?? 0;
        frag.push(`
          <div class="hour tile lift${n === 0 ? " now" : ""}">
            <span class="h-time">${n === 0 ? "Now" : fmtHour(h.time[idx])}</span>
            ${iconSVG(iconKey(h.weather_code[idx], h.is_day[idx] === 1))}
            <span class="h-temp">${fmtTemp(h.temperature_2m[idx])}°</span>
            <span class="h-pop${pop >= 5 ? "" : " ghost"}">${pop >= 5 ? pop + "%" : "·"}</span>
          </div>`);
      }
      els.hourStrip.innerHTML = frag.join("");
      els.hourStrip.scrollTo({ left: 0 });
    }

    function renderDaily() {
      const d = state.data, day = d.daily;
      const weekMin = Math.min(...day.temperature_2m_min);
      const weekMax = Math.max(...day.temperature_2m_max);
      const span = Math.max(1, weekMax - weekMin);
      const todayName = new Date().toLocaleDateString([], { weekday: "long" });

      const frag = day.time.map((iso, i) => {
        const name = i === 0 ? (todayName.length <= 7 ? todayName : "Today")
                             : new Date(iso + "T12:00").toLocaleDateString([], { weekday: "short" });
        const lo = ((day.temperature_2m_min[i] - weekMin) / span) * 100;
        const hi = ((day.temperature_2m_max[i] - weekMin) / span) * 100;
        const pop = day.precipitation_probability_max?.[i] ?? 0;
        const nowMark = i === 0
          ? `style="--lo:${lo}%;--hi:${hi}%;--now:${clamp(((d.current.temperature_2m - weekMin) / span) * 100, 0, 100)}%"`
          : `style="--lo:${lo}%;--hi:${hi}%"`;
        return `
          <div class="day-row lift">
            <span class="d-name">${name}</span>
            <span class="d-ic">${iconSVG(iconKey(day.weather_code[i], true))}</span>
            <span class="d-pop${pop >= 5 ? "" : " hide"}">${pop}%</span>
            <span class="range-val min">${fmtTemp(day.temperature_2m_min[i])}°</span>
            <div class="range" ${nowMark}><div class="range-fill"></div>${i === 0 ? '<i class="range-now"></i>' : ""}</div>
            <span class="range-val max">${fmtTemp(day.temperature_2m_max[i])}°</span>
          </div>`;
      });
      els.dayList.innerHTML = frag.join("");
    }

    /* ---------------- live clock + sun tracking ---------------- */
    function startClock() {
      clearInterval(state.clockTimer);
      const tick = () => {
        try {
          els.clockText.textContent = new Intl.DateTimeFormat("en-GB", {
            timeZone: state.tz, weekday: "short", hour: "2-digit", minute: "2-digit"
          }).format(new Date());
        } catch { els.clockText.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
        if (state.data) positionSun(new Date(state.data.daily.sunrise[0]), new Date(state.data.daily.sunset[0]));
      };
      tick();
      state.clockTimer = setInterval(tick, 1000);
    }

    /* ============================================================
       SEARCH (geocoding + suggestions)
    ============================================================ */
    let searchSeq = 0, activeIdx = -1, lastResults = [], debTimer = null;

    function closeSuggest() { els.suggest.classList.remove("open"); activeIdx = -1; }

    function renderSuggestions(list) {
      lastResults = list; activeIdx = -1;
      els.suggest.innerHTML = list.map((p, i) => `
        <button type="button" class="sug" role="option" data-i="${i}" id="sug-${i}">
          <span class="flag">${flag(p.country_code)}</span>
          <span class="sug-txt"><b>${p.name}</b><i>${[p.admin1, p.country].filter(Boolean).join(", ")}</i></span>
        </button>`).join("");
      els.suggest.classList.add("open");
    }

    async function runSearch(q) {
      const seq = ++searchSeq;
      try {
        const res = await getJSON(`${API.geocode}?name=${encodeURIComponent(q)}&count=6&language=en&format=json`, 8000);
        if (seq !== searchSeq) return;
        const list = res.results || [];
        list.length ? renderSuggestions(list) : closeSuggest();
      } catch { if (seq === searchSeq) closeSuggest(); }
    }

    els.searchInput.addEventListener("input", () => {
      const q = els.searchInput.value.trim();
      els.clearBtn.hidden = q.length === 0;
      clearTimeout(debTimer);
      if (q.length < 2) { closeSuggest(); return; }
      debTimer = setTimeout(() => runSearch(q), 350);
    });

    els.searchInput.addEventListener("keydown", e => {
      const open = els.suggest.classList.contains("open");
      if (e.key === "ArrowDown" && open) { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, lastResults.length - 1); paintActive(); }
      else if (e.key === "ArrowUp" && open) { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); paintActive(); }
      else if (e.key === "Escape") closeSuggest();
    });
    const paintActive = () => $$(".sug", els.suggest).forEach((b, i) => b.classList.toggle("active", i === activeIdx));

    els.searchForm.addEventListener("submit", e => {
      e.preventDefault();
      if (!lastResults.length) return;
      pickPlace(lastResults[activeIdx >= 0 ? activeIdx : 0]);
    });

    els.suggest.addEventListener("click", e => {
      const btn = e.target.closest(".sug");
      if (btn) pickPlace(lastResults[+btn.dataset.i]);
    });

    els.clearBtn.addEventListener("click", () => {
      els.searchInput.value = ""; els.clearBtn.hidden = true;
      closeSuggest(); els.searchInput.focus();
    });

    document.addEventListener("click", e => {
      if (!els.searchForm.contains(e.target)) closeSuggest();
    }, { passive: true });

    function pickPlace(p) {
      if (!p) return;
      closeSuggest();
      els.searchInput.value = p.name;
      els.searchInput.blur();
      loadPlace({ name: p.name, latitude: p.latitude, longitude: p.longitude,
                  admin1: p.admin1, country: p.country, country_code: p.country_code });
    }

    /* ============================================================
       UNITS (instant client-side conversion, no refetch)
    ============================================================ */
    els.units.addEventListener("click", e => {
      const btn = e.target.closest("button[data-u]");
      if (!btn || state.unit === btn.dataset.u) return;
      state.unit = btn.dataset.u;
      els.units.dataset.unit = state.unit;
      $$("button[data-u]", els.units).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.u === state.unit)));
      if (state.data) renderAll();
    });

    /* ============================================================
       GEOLOCATION + REVERSE GEOCODE
    ============================================================ */
    const CUPERTINO = { name: "Cupertino", latitude: 37.3230, longitude: -122.0322,
                        admin1: "California", country: "United States", country_code: "US" };

    async function placeFromCoords(lat, lon, silentFail = false) {
      try {
        const r = await getJSON(`${API.reverse}?latitude=${lat}&longitude=${lon}&localityLanguage=en`, 6000);
        return { name: r.city || r.locality || "My location", latitude: lat, longitude: lon,
                 admin1: r.principalSubdivision, country: r.countryName, country_code: r.countryCode };
      } catch {
        if (!silentFail) toast("Reverse lookup failed — using coordinates.");
        return { name: "My location", latitude: lat, longitude: lon };
      }
    }

    function locate(opts, onFail) {
      if (!navigator.geolocation) { onFail(); return; }
      navigator.geolocation.getCurrentPosition(
        async pos => loadPlace(await placeFromCoords(pos.coords.latitude, pos.coords.longitude)),
        onFail, opts
      );
    }

    els.locateBtn.addEventListener("click", () => {
      els.locateBtn.classList.add("busy");
      locate({ timeout: 9000, maximumAge: 600000 }, () => {
        toast("Location unavailable — search for a city instead.");
      });
      setTimeout(() => els.locateBtn.classList.remove("busy"), 2500);
    });

    /* ============================================================
       HOURLY RAIL: buttons + drag / touch scrubbing
    ============================================================ */
    els.hourPrev.addEventListener("click", () => els.hourStrip.scrollBy({ left: -344, behavior: "smooth" }));
    els.hourNext.addEventListener("click", () => els.hourStrip.scrollBy({ left:  344, behavior: "smooth" }));

    let dragging = false, dragX = 0, dragL = 0;
    els.hourStrip.addEventListener("pointerdown", e => {
      dragging = true; dragX = e.clientX; dragL = els.hourStrip.scrollLeft;
      els.hourStrip.classList.add("grabbing");
    }, { passive: true });
    window.addEventListener("pointermove", e => {
      if (dragging) els.hourStrip.scrollLeft = dragL - (e.clientX - dragX);
    }, { passive: true });
    window.addEventListener("pointerup", () => {
      dragging = false; els.hourStrip.classList.remove("grabbing");
    }, { passive: true });

    /* ============================================================
       BOOT
    ============================================================ */
    showLoader("Finding your sky…");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async pos => loadPlace(await placeFromCoords(pos.coords.latitude, pos.coords.longitude, true)),
        () => loadPlace(CUPERTINO),
        { timeout: 3500, maximumAge: 600000 }
      );
    } else {
      loadPlace(CUPERTINO);
    }
  })();
  </script>
</body>
</html>
